<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFC11E">
<title>GymGeek · M10 Strength Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Raleway:ital,wght@1,900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Jost:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#c8900a; --yellow-b:#FFC11E; --green:#1a9e6a; --blue:#4a62b8; --red:#e03030;
    --bg:#eef1f4; --card:#ffffff; --card2:#f4f6f8; --border:#d8dde3; --border-soft:rgba(0,0,0,.07);
    --text:#1a1c1e; --muted:#5a6a7a; --field:#ffffff;
  }
  html[data-theme="dark"]{
    --yellow:#FFC11E; --yellow-b:#FFC11E; --green:#61C599; --blue:#778FDD; --red:#ff6363;
    --bg:#232628; --card:#2c2f32; --card2:#26282b; --border:#3a3d40; --border-soft:rgba(255,255,255,.07);
    --text:#f0f4ff; --muted:#7a8ba8; --field:#1e2124;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;
    min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)); overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ── STICKY HEADER ── */
  .app-head{
    position:sticky; top:0; z-index:40; background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;
    border-bottom:1px solid var(--border-soft);
    box-shadow:0 6px 18px rgba(0,0,0,.06);
  }
  .head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .brand{font-family:'Raleway',sans-serif;font-style:italic;font-weight:900;font-size:19px;color:var(--text);line-height:1;}
  .brand .club{font-family:'Jost',sans-serif;font-style:normal;font-weight:200;font-size:11px;letter-spacing:.4em;color:var(--muted);margin-left:5px;text-transform:uppercase;}
  .brand-sub{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);font-weight:700;margin-top:3px;}
  .head-btns{display:flex;gap:6px;flex-shrink:0;}
  .ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ibtn:active{transform:scale(.94);}

  /* week pills */
  .weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:9px;scrollbar-width:none;}
  .weeks::-webkit-scrollbar{display:none;}
  .wpill{flex:1 0 auto;min-width:60px;padding:9px 6px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:600;font-size:12px;text-align:center;cursor:pointer;transition:all .12s;white-space:nowrap;}
  .wpill .wk-sub{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:1px;}
  .wpill.on{background:var(--yellow-b);border-color:var(--yellow-b);color:#1a1c1e;box-shadow:0 3px 12px rgba(255,193,30,.4);}

  /* day tabs */
  .days{display:flex;gap:6px;}
  .dtab{flex:1;padding:8px 4px 7px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;text-align:center;transition:all .12s;position:relative;}
  .dtab .dn{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.02em;line-height:1;}
  .dtab .df{display:block;font-size:8px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;opacity:.8;line-height:1.1;}
  .dtab.on{border-color:var(--yellow-b);background:rgba(255,193,30,.12);color:var(--text);}
  .dtab.on .dn{color:var(--yellow);}
  .dtab .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .15s;}
  .dtab.has .dot{opacity:1;}

  /* ── SESSION ── */
  main{padding:14px 12px 0;max-width:620px;margin:0 auto;}
  .ss-focus{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;margin-bottom:2px;}
  .ss-hint{font-size:11px;color:var(--muted);margin-bottom:16px;}
  .ss-hint b{color:var(--yellow);font-weight:600;}

  .sup-label{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin:18px 2px 8px;display:flex;align-items:center;gap:7px;}
  .sup-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow-b);box-shadow:0 0 8px rgba(255,193,30,.8);}

  .ex{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 14px 14px;margin-bottom:10px;box-shadow:0 6px 16px rgba(20,30,50,.05);}
  .ex.done{border-color:var(--green);}
  .ex-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;}
  .ex-code{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);padding-top:3px;min-width:20px;}
  .ex-main{flex:1;}
  .ex-name{font-size:15px;font-weight:600;line-height:1.25;}
  .ex-target{font-size:11px;color:var(--muted);margin-top:2px;}
  .ex-target b{color:var(--text);font-weight:600;}
  .ex-note{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:3px;}
  .ex-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-size:13px;margin-top:1px;}
  .ex.done .ex-check{background:var(--green);border-color:var(--green);color:#fff;}

  /* set rows */
  .sets{display:flex;flex-direction:column;gap:7px;}
  .setrow{display:grid;grid-template-columns:30px 1fr 16px 1fr 46px;align-items:center;gap:7px;}
  .set-n{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;}
  .fld{height:46px;border-radius:11px;border:1px solid var(--border);background:var(--field);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;text-align:center;width:100%;}
  .fld:focus{outline:none;border-color:var(--yellow-b);box-shadow:0 0 0 3px rgba(255,193,30,.18);}
  .fld::placeholder{color:var(--muted);font-weight:400;opacity:.65;}
  .xsep{text-align:center;color:var(--muted);font-size:13px;}
  .tick{height:46px;border-radius:11px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .setrow.on .tick{background:var(--green);border-color:var(--green);color:#fff;}
  .setrow.on .fld{border-color:var(--green);}
  .flbl{display:grid;grid-template-columns:30px 1fr 16px 1fr 46px;gap:7px;margin-bottom:5px;}
  .flbl span{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;}
  .flbl span:nth-child(1),.flbl span:nth-child(3),.flbl span:nth-child(5){opacity:0;}

  .last{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .last .lw{font-weight:700;color:var(--yellow);letter-spacing:.06em;text-transform:uppercase;font-size:9px;}
  .last .lvals{font-family:'DM Mono',monospace;color:var(--text);}
  .copy{margin-left:auto;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:10px;font-weight:600;cursor:pointer;}
  .copy:active{transform:scale(.95);}

  .notecard{background:var(--card2);border:1px dashed var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:11px;}
  .notecard .nc-code{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
  .notecard .nc-name{font-size:14px;font-weight:600;}
  .notecard .nc-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px;}

  .foot{text-align:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;padding:22px 0 8px;}

  /* ── REST TIMER FAB + SHEET ── */
  .rest-fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;padding:14px 20px;border-radius:50px;background:var(--yellow-b);color:#1a1c1e;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;box-shadow:0 6px 22px rgba(255,193,30,.5);cursor:pointer;}
  .rest-fab:active{transform:scale(.96);}
  .sheet-bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
  .sheet-bd.open{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-grip{width:38px;height:4px;border-radius:3px;background:var(--border);margin:0 auto 14px;}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .sheet-h h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;font-weight:400;}
  .rest-disp{font-family:'DM Mono',monospace;font-size:56px;font-weight:500;text-align:center;letter-spacing:.03em;line-height:1;margin:6px 0 14px;color:var(--yellow);}
  .rest-disp.rest-idle{color:var(--muted);}
  .rest-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
  .rp{padding:14px 4px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
  .rp:active{transform:scale(.95);}
  .rest-ctrl{display:flex;gap:8px;}
  .rc{flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .rc.add{background:var(--card2);border:1px solid var(--border);color:var(--text);}
  .rc.stop{background:var(--red);color:#fff;}

  /* menu dropdown */
  .menu{position:absolute;top:56px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:45;display:none;min-width:180px;}
  .menu.open{display:block;}
  .menu button{width:100%;text-align:left;padding:11px 12px;border:none;background:transparent;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;border-radius:9px;cursor:pointer;}
  .menu button:active{background:var(--card2);}
  .menu button.danger{color:var(--red);}
  .menu .mlbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;}

  @media(min-width:560px){.setrow,.flbl{grid-template-columns:34px 1fr 20px 1fr 52px;}}
</style>
</head>
<body>

<header class="app-head">
  <div class="head-top">
    <div>
      <div class="brand">GYMGEEK<span class="club">Club PT</span></div>
      <div class="brand-sub">M10 Strength · Tracker</div>
    </div>
    <div class="head-btns">
      <button class="ibtn" id="themeBtn" aria-label="Theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="ibtn" id="menuBtn" aria-label="Menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>
  <div class="menu" id="menu">
    <div class="mlbl">Saved on this device</div>
    <button id="exportBtn">Copy my data (backup)</button>
    <button class="danger" id="clearWeekBtn">Clear this week</button>
    <button class="danger" id="clearAllBtn">Clear all data</button>
  </div>
</header>

<main id="session"></main>
<div class="foot">gymgeekonline.co.uk · Treat Train Perform</div>

<button class="rest-fab" id="restFab">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  Rest
</button>

<div class="sheet-bd" id="restBd">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-h"><h3>Rest Timer</h3><button class="ibtn" id="restClose">✕</button></div>
    <div class="rest-disp rest-idle" id="restDisp">0:00</div>
    <div class="rest-presets">
      <button class="rp" data-s="45">45s</button>
      <button class="rp" data-s="60">60s</button>
      <button class="rp" data-s="90">90s</button>
      <button class="rp" data-s="120">2m</button>
    </div>
    <div class="rest-ctrl">
      <button class="rc add" id="restAdd">+15s</button>
      <button class="rc stop" id="restStop">Stop</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ PROGRAM DATA — M10 Strength ═══════════ */
var PROGRAM=[
 {focus:"Lower & Core", blocks:[
   {label:"Superset A",items:[
     {id:"d1a1",code:"A1",name:"Hip Thrust March",sets:3,reps:"20"},
     {id:"d1a2",code:"A2",name:"Trap Bar Deadlift",sets:3,reps:"10"}]},
   {label:"Superset B",items:[
     {id:"d1b1",code:"B1",name:"Bulgarian Split Squat",sets:3,reps:"10"},
     {id:"d1b2",code:"B2",name:"Banded Pallof Weighted",sets:3,reps:"8"}]},
   {label:"Superset C",items:[
     {id:"d1c1",code:"C1",name:"Spanish Squats",sets:3,reps:"15"},
     {id:"d1c2",code:"C2",name:"Dead Hang",sets:3,reps:"30",note:"suit case hold"}]},
   {label:"Superset D",items:[
     {id:"d1d1",code:"D1",name:"Elevated Plank",sets:3,reps:"30 sec"},
     {id:"d1d2",code:"D2",name:"Wood Chop",sets:3,reps:"12"}]}
 ]},
 {focus:"Upper Body", blocks:[
   {label:"Superset A",items:[
     {id:"d2a1",code:"A1",name:"Incline Bench Press",sets:4,reps:"6"},
     {id:"d2a2",code:"A2",name:"T Bar Row",sets:4,reps:"8"}]},
   {label:"Superset B",items:[
     {id:"d2b1",code:"B1",name:"Seated Dumbbell Overhead Press",sets:3,reps:"10"},
     {id:"d2b2",code:"B2",name:"Single Arm Lat Pulldown",sets:3,reps:"12"}]},
   {label:"Superset C",items:[
     {id:"d2c1",code:"C1",name:"Dumbbell Fly",sets:3,reps:"12"},
     {id:"d2c2",code:"C2",name:"Reverse Fly",sets:3,reps:"15"}]},
   {label:"Superset D",items:[
     {id:"d2d1",code:"D1",name:"Hammer Curls",sets:3,reps:"10"},
     {id:"d2d2",code:"D2",name:"EZ Bar Skull Crusher",sets:3,reps:"12"}]}
 ]},
 {focus:"Lower & Hinge", blocks:[
   {label:"Superset A",items:[
     {id:"d3a1",code:"A1",name:"Hip Thrust",sets:4,reps:"10"},
     {id:"d3a2",code:"A2",name:"Deadlift",sets:4,reps:"5"}]},
   {label:"Superset B",items:[
     {id:"d3b1",code:"B1",name:"DB Reverse Lunge",sets:3,reps:"12"},
     {id:"d3b2",code:"B2",name:"Single Leg Barbell RDL",sets:3,reps:"8",note:"Not B stance so 1 foot should be completely off the floor"}]},
   {label:"Superset C",items:[
     {id:"d3c1",code:"C1",name:"Glute Ham Raise",sets:3,reps:"10"},
     {id:"d3c2",code:"C2",name:"Goblet Squat",sets:3,reps:"16"}]},
   {label:"Superset D",items:[
     {id:"d3d1",code:"D1",name:"Negative Roll Out",sets:3,reps:"6"},
     {id:"d3d2",code:"D2",name:"Wall Sit Tip Toes",sets:3,reps:"45 sec"}]}
 ]},
 {focus:"Upper & Core", blocks:[
   {label:"Superset A",items:[
     {id:"d4a1",code:"A1",name:"Single Arm Bird Dog Row",sets:3,reps:"8"},
     {id:"d4a2",code:"A2",name:"Landmine Lean To Press",sets:3,reps:"10"}]},
   {label:"Superset B",items:[
     {id:"d4b1",code:"B1",name:"DB Incline Press",sets:4,reps:"10",rest:"1 min"},
     {id:"d4b2",code:"B2",name:"Single Arm Lat Pulldown",sets:4,reps:"10"}]},
   {label:"Superset C",items:[
     {id:"d4c1",code:"C1",name:"Upright Row",sets:3,reps:"15"},
     {id:"d4c2",code:"C2",name:"Hammer Curls",sets:3,reps:"12"},
     {id:"d4c3",code:"C3",name:"Banded Pushdown",sets:3,reps:"12"}]},
   {label:"Superset D",items:[
     {id:"d4d1",code:"D1",name:"Cable Crunch",sets:3,reps:"15"},
     {id:"d4d2",code:"D2",name:"Landmine Russian Twist",sets:3,reps:"10"}]}
 ]}
];
var WEEKS=5;

/* ═══════════ STORAGE ═══════════ */
var KEY='gymgeek-m10str-v2';
var store={ui:{week:1,day:1,theme:'light'},log:{}};
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);store.ui=Object.assign(store.ui,p.ui||{});store.log=p.log||{};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function cell(w,d,id){store.log[w]=store.log[w]||{};store.log[w][d]=store.log[w][d]||{};store.log[w][d][id]=store.log[w][d][id]||{sets:[]};return store.log[w][d][id];}
function getCell(w,d,id){return store.log[w]&&store.log[w][d]&&store.log[w][d][id];}
function exHasData(c){return c&&c.sets&&c.sets.some(function(s){return s&&(s.w||s.r||s.done);});}
function lastTime(d,id,w){for(var p=w-1;p>=1;p--){var c=getCell(p,d,id);if(exHasData(c))return{week:p,sets:c.sets};}return null;}
function dayHasData(w,d){var dd=store.log[w]&&store.log[w][d];if(!dd)return false;for(var k in dd){if(exHasData(dd[k]))return true;}return false;}

/* ═══════════ BUILD HEADER CONTROLS ═══════════ */
var weeksEl=document.getElementById('weeks'), daysEl=document.getElementById('days');
function buildWeeks(){
  var h='';
  for(var w=1;w<=WEEKS;w++){h+='<button class="wpill" data-w="'+w+'">Week '+w+'<span class="wk-sub">W'+w+'</span></button>';}
  weeksEl.innerHTML=h;
}
function buildDays(){
  var h='';
  for(var d=1;d<=4;d++){h+='<button class="dtab" data-d="'+d+'"><span class="dn">Day '+d+'</span><span class="dot"></span></button>';}
  daysEl.innerHTML=h;
}
function syncControls(){
  [].forEach.call(weeksEl.children,function(b){b.classList.toggle('on',+b.dataset.w===store.ui.week);});
  [].forEach.call(daysEl.children,function(b){
    b.classList.toggle('on',+b.dataset.d===store.ui.day);
    b.classList.toggle('has',dayHasData(store.ui.week,+b.dataset.d));
  });
}

/* ═══════════ RENDER SESSION ═══════════ */
var sessionEl=document.getElementById('session');
function repNum(r){var m=(''+r).match(/[\d.]+/);return m?m[0]:'';}
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var d=store.ui.day, w=store.ui.week, day=PROGRAM[d-1];
  var h='<div class="ss-focus">Day '+d+'</div>';
  h+='<div class="ss-hint">Week '+w+' · log <b>weight</b> &amp; <b>reps</b>, tap <b>✓</b> when a set is done. Saves automatically.</div>';
  day.blocks.forEach(function(b){
    if(b.label) h+='<div class="sup-label">'+esc(b.label)+'</div>';
    b.items.forEach(function(it){
      if(it.type==='note'){
        h+='<div class="notecard"><div class="nc-code">'+it.code+'</div><div><div class="nc-name">'+esc(it.name)+'</div>'+(it.note?'<div class="nc-note">'+esc(it.note)+'</div>':'')+'</div></div>';
        return;
      }
      var c=getCell(w,d,it.id);
      var allDone=c&&c.sets&&c.sets.length>=it.sets&&c.sets.slice(0,it.sets).every(function(s){return s&&s.done;});
      h+='<div class="ex'+(allDone?' done':'')+'" data-ex="'+it.id+'" data-sets="'+it.sets+'">';
      h+='<div class="ex-top"><div class="ex-code">'+it.code+'</div><div class="ex-main"><div class="ex-name">'+esc(it.name)+'</div>';
      h+='<div class="ex-target"><b>'+it.sets+'</b> × <b>'+esc(it.reps)+'</b>'+(it.rest?' · '+esc(it.rest)+' rest':'')+'</div>';
      if(it.note) h+='<div class="ex-note">'+esc(it.note)+'</div>';
      h+='</div><div class="ex-check">✓</div></div>';
      h+='<div class="flbl"><span></span><span>Weight</span><span></span><span>Reps</span><span></span></div>';
      h+='<div class="sets">';
      for(var i=0;i<it.sets;i++){
        var s=(c&&c.sets&&c.sets[i])||{};
        var on=s.done?' on':'';
        h+='<div class="setrow'+on+'" data-set="'+i+'">'+
           '<div class="set-n">'+(i+1)+'</div>'+
           '<input class="fld" inputmode="decimal" placeholder="kg" data-ex="'+it.id+'" data-set="'+i+'" data-f="w" value="'+(s.w?esc(s.w):'')+'">'+
           '<div class="xsep">×</div>'+
           '<input class="fld" inputmode="numeric" placeholder="'+repNum(it.reps)+'" data-ex="'+it.id+'" data-set="'+i+'" data-f="r" value="'+(s.r?esc(s.r):'')+'">'+
           '<button class="tick" data-ex="'+it.id+'" data-set="'+i+'">✓</button>'+
           '</div>';
      }
      h+='</div>';
      var lt=lastTime(d,it.id,w);
      if(lt){
        var vals=lt.sets.map(function(s){if(!s)return null;var ww=s.w||'–',rr=s.r||repNum(it.reps);return ww+'×'+rr;}).filter(Boolean).join('  ·  ');
        h+='<div class="last"><span class="lw">Last W'+lt.week+'</span><span class="lvals">'+esc(vals)+'</span><button class="copy" data-ex="'+it.id+'">Copy</button></div>';
      }
      h+='</div>';
    });
  });
  sessionEl.innerHTML=h;
}

/* ═══════════ INPUT HANDLING (delegated) ═══════════ */
sessionEl.addEventListener('input',function(e){
  var t=e.target; if(!t.dataset||!t.dataset.ex||!t.classList.contains('fld'))return;
  var c=cell(store.ui.week,store.ui.day,t.dataset.ex); var i=+t.dataset.set;
  c.sets[i]=c.sets[i]||{}; c.sets[i][t.dataset.f]=t.value;
  save(); syncControls();
});
sessionEl.addEventListener('click',function(e){
  var tick=e.target.closest('.tick');
  if(tick){
    var c=cell(store.ui.week,store.ui.day,tick.dataset.ex); var i=+tick.dataset.set;
    c.sets[i]=c.sets[i]||{}; c.sets[i].done=!c.sets[i].done;
    var row=tick.closest('.setrow'); row.classList.toggle('on',!!c.sets[i].done);
    var exEl=tick.closest('.ex'); var n=+exEl.dataset.sets;
    var all=true; for(var k=0;k<n;k++){ if(!(c.sets[k]&&c.sets[k].done)){all=false;break;} }
    exEl.classList.toggle('done',all);
    save(); syncControls();
    if(c.sets[i].done) beep();
    return;
  }
  var cp=e.target.closest('.copy');
  if(cp){
    var d=store.ui.day,w=store.ui.week,id=cp.dataset.ex;
    var lt=lastTime(d,id,w); if(!lt)return;
    var c2=cell(w,d,id);
    var exEl2=cp.closest('.ex'); var rows=exEl2.querySelectorAll('.setrow');
    rows.forEach(function(row,i){
      var ls=lt.sets[i]; if(!ls)return;
      var wIn=row.querySelector('[data-f="w"]'), rIn=row.querySelector('[data-f="r"]');
      c2.sets[i]=c2.sets[i]||{};
      if(!wIn.value&&ls.w){wIn.value=ls.w;c2.sets[i].w=ls.w;}
      if(!rIn.value&&ls.r){rIn.value=ls.r;c2.sets[i].r=ls.r;}
    });
    save(); syncControls();
    cp.textContent='Copied'; setTimeout(function(){cp.textContent='Copy';},1200);
  }
});

/* ═══════════ WEEK / DAY SWITCHING ═══════════ */
weeksEl.addEventListener('click',function(e){var b=e.target.closest('.wpill');if(!b)return;store.ui.week=+b.dataset.w;save();render();syncControls();window.scrollTo({top:0,behavior:'smooth'});});
daysEl.addEventListener('click',function(e){var b=e.target.closest('.dtab');if(!b)return;store.ui.day=+b.dataset.d;save();render();syncControls();window.scrollTo({top:0,behavior:'smooth'});});

/* ═══════════ THEME ═══════════ */
function applyTheme(){document.documentElement.setAttribute('data-theme',store.ui.theme);document.querySelector('meta[name=theme-color]').setAttribute('content',store.ui.theme==='dark'?'#232628':'#FFC11E');}
document.getElementById('themeBtn').addEventListener('click',function(){store.ui.theme=store.ui.theme==='dark'?'light':'dark';applyTheme();save();});

/* ═══════════ MENU ═══════════ */
var menu=document.getElementById('menu');
document.getElementById('menuBtn').addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('open');});
document.addEventListener('click',function(){menu.classList.remove('open');});
menu.addEventListener('click',function(e){e.stopPropagation();});
document.getElementById('clearWeekBtn').addEventListener('click',function(){
  if(confirm('Clear all logged weights for Week '+store.ui.week+'? This cannot be undone.')){
    if(store.log[store.ui.week])delete store.log[store.ui.week];
    save();render();syncControls();menu.classList.remove('open');
  }
});
document.getElementById('clearAllBtn').addEventListener('click',function(){
  if(confirm('Clear ALL saved weights across every week? This cannot be undone.')){
    store.log={};save();render();syncControls();menu.classList.remove('open');
  }
});
document.getElementById('exportBtn').addEventListener('click',function(){
  var txt=JSON.stringify(store.log);
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('Your training data has been copied to the clipboard. Paste it somewhere safe as a backup.');});}
  else{prompt('Copy your backup data:',txt);}
  menu.classList.remove('open');
});

/* ═══════════ REST TIMER ═══════════ */
var restBd=document.getElementById('restBd'), restDisp=document.getElementById('restDisp');
var restEnd=0, restInt=null;
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function restTick(){var rem=Math.round((restEnd-Date.now())/1000);restDisp.textContent=fmt(rem);if(rem<=0){clearInterval(restInt);restInt=null;restDisp.classList.add('rest-idle');beep();beep2();}}
function startRest(sec){clearInterval(restInt);restEnd=Date.now()+sec*1000;restDisp.classList.remove('rest-idle');restTick();restInt=setInterval(restTick,250);}
document.getElementById('restFab').addEventListener('click',function(){unlock();restBd.classList.add('open');});
document.getElementById('restClose').addEventListener('click',function(){restBd.classList.remove('open');});
restBd.addEventListener('click',function(e){if(e.target===restBd)restBd.classList.remove('open');});
[].forEach.call(document.querySelectorAll('.rp'),function(b){b.addEventListener('click',function(){unlock();startRest(+b.dataset.s);});});
document.getElementById('restAdd').addEventListener('click',function(){if(restInt){restEnd+=15000;restTick();}else{startRest(15);}});
document.getElementById('restStop').addEventListener('click',function(){clearInterval(restInt);restInt=null;restDisp.textContent='0:00';restDisp.classList.add('rest-idle');});

/* ═══════════ AUDIO ═══════════ */
var actx=null,aOn=false;
function unlock(){if(aOn)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();var b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);actx.resume();aOn=true;}catch(e){}}
document.addEventListener('touchstart',unlock,{passive:true,once:false});
function tone(f,dur,vol,off){try{if(!actx)return;if(actx.state==='suspended')actx.resume();var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';var t=actx.currentTime+(off||0);o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.4,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
function beep(){tone(880,0.08,0.35,0);}
function beep2(){tone(660,0.18,0.4,0.09);tone(990,0.3,0.4,0.28);}

/* ═══════════ INIT ═══════════ */
load();
if(store.ui.week<1||store.ui.week>WEEKS)store.ui.week=1;
if(store.ui.day<1||store.ui.day>4)store.ui.day=1;
applyTheme();
buildWeeks();buildDays();
render();syncControls();
/* storage-availability guard */
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){
  var warn=document.createElement('div');warn.style.cssText='background:#ff6363;color:#fff;font-size:12px;padding:8px 12px;text-align:center;';
  warn.textContent='Private browsing is on, so your weights will not be saved between visits.';
  document.body.insertBefore(warn,document.body.firstChild);
}
</script>
</body>

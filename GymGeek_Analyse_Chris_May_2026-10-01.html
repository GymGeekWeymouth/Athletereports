<style>
:root{
  --bg:#1C1E20;--card:#2A2D30;--card2:#33363A;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#F5F7FA;--muted:#8B97AB;--faint:#5E6878;
  --green:#61C599;--yellow:#FFC11E;--blue:#778FDD;--red:#ff6363;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.6);
  --display:'Montserrat',system-ui,sans-serif;--body:'Open Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
body.light,body.print{
  --bg:#F4F5F7;--card:#FFFFFF;--card2:#F1F3F5;--line:rgba(17,19,21,.08);--line2:rgba(17,19,21,.16);
  --text:#111315;--muted:#5F6B7A;--faint:#98A2B0;
  --green:#14935F;--yellow:#C08600;--blue:#4A62B8;--red:#D04040;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -16px rgba(16,24,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:28px 20px 64px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px 4px}
.logo{font-family:'Raleway',sans-serif;font-style:italic;font-weight:900;font-size:22px;letter-spacing:.01em;line-height:1}
.logo span{font-family:var(--display);font-style:normal;font-weight:500;font-size:11px;letter-spacing:.42em;color:var(--muted);margin-left:8px;vertical-align:3px}
.pby{font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:5px}
.pby b{font-family:'Raleway',sans-serif;font-style:italic;font-weight:900;color:var(--muted);letter-spacing:.02em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:var(--card);border-color:var(--muted)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn .ic{font-size:14px}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* group markers: filled = group 1, ring = group 2 (colour is reserved for meaning) */
.gm{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.gm.g0{background:var(--text)}
.gm.g1{border:2px solid var(--text)}
.ln{display:inline-block;width:18px;height:0;vertical-align:3px;margin-right:6px}
.ln.you{border-top:3px solid var(--green);border-radius:2px}
.ln.g0{border-top:2px dashed var(--text)}
.ln.g1{border-top:2px dotted var(--muted)}
.ln.last{border-top:2px dashed var(--green);opacity:.55}

/* cards + section headers */
.card{background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);position:relative}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sh h2{font:800 26px/1.1 var(--display);letter-spacing:-.02em}
.sh-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:7px}
.share{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s;font-size:14px}
.share:hover{color:var(--text);border-color:var(--muted)}
.stamp{display:none;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.stamp b{font-family:'Raleway',sans-serif;font-style:italic;font-weight:900;color:var(--muted);letter-spacing:.02em}
body.capturing .stamp{display:block}
body.capturing .share{display:none}

/* avatar */
.avatar{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font:800 22px var(--display);letter-spacing:-.02em;color:#fff;background:linear-gradient(135deg,#61C599,#3E8F86 55%,#4A62B8);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line2)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* hero */
.hero{padding:0;overflow:hidden}
.hero-main{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:34px 34px 28px;background:radial-gradient(120% 140% at 100% 0%,rgba(97,197,153,.16),transparent 55%)}
.who{display:flex;align-items:center;gap:16px;margin:12px 0 16px}
.hero h1{font:900 clamp(32px,5.2vw,56px)/1 var(--display);letter-spacing:-.035em}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--card2);color:var(--muted)}
.fact b{color:var(--text);font-weight:600}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px;gap:2px;margin-top:18px;flex-wrap:wrap}
.seg button{font:600 12px var(--body);border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}
.seg button small{font-weight:400;opacity:.75;margin-left:6px}
.ring{position:relative;width:188px;height:188px;flex:none}
.ring svg{width:100%;height:100%}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c .k{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ring-c b{font:900 64px/1 var(--display);letter-spacing:-.04em;margin:4px 0 2px}
.ring-c .lvl{font:700 13px var(--display)}
.hero-sub{display:grid;grid-template-columns:1fr auto;gap:28px;padding:22px 34px 26px;border-top:1px solid var(--line);align-items:end}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.part .pn{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px;gap:6px}
.part .pn span{display:inline-flex;align-items:center;gap:6px}
.part .pn b{font:500 11px var(--mono);color:var(--faint)}
.pbar{height:6px;border-radius:999px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--green);transform-origin:left}
.beat{display:flex;align-items:center;gap:12px;white-space:nowrap}
.beat .t{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.beat .t .ic{font-size:18px;color:var(--green)}
.beat .v{font:900 30px/1 var(--display);color:var(--green);letter-spacing:-.02em}
.delta{display:inline-flex;align-items:center;gap:3px;font:700 11px var(--body);padding:3px 8px;border-radius:999px;white-space:nowrap}
.hist{display:flex;gap:8px;align-items:flex-end;height:64px}
.hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.hist span{display:block;width:26px;border-radius:6px;background:var(--card2)}
.hist .on span{background:var(--green)}
.hist small{font:500 9px var(--mono);color:var(--muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px 34px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}
.note .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:7px;box-shadow:0 0 0 4px rgba(97,197,153,.2)}

/* tiles */
.sub{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.sub+.grid{margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card2);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-name{display:inline-flex;align-items:center;gap:9px;font:700 13px var(--display);letter-spacing:-.005em}
.t-name .ib{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--card);color:var(--text);font-size:15px}
.tag{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:3px 7px;border-radius:999px}
.t-val{display:flex;align-items:baseline;gap:8px}
.t-val .num{font:800 44px/1 var(--display);letter-spacing:-.035em}
.grid.three .t-val .num{font-size:34px}
.t-val .unit{font-size:12px;color:var(--muted)}
.t-val .delta{margin-left:auto}
.spark{display:block;width:100%;height:28px}
.cmp+.cmp{margin-top:12px}
.cmp-l{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:7px}
.cmp-l span:first-child{display:flex;align-items:center;gap:8px;color:var(--muted)}
.cmp-l b{font-weight:700}
.strip{position:relative;height:6px;display:flex;gap:3px}
.strip s{display:block;flex:none;height:100%;border-radius:999px}
.strip i{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%)}
.strip i.g0{background:var(--text);border:3px solid var(--card2)}
.strip i.g1{background:var(--card2);border:3px solid var(--text)}
.sx{display:flex;justify-content:space-between;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.davg{font-size:11.5px;color:var(--muted)}
.davg b{color:var(--text);font-weight:600}
.t-note{font-size:11.5px;line-height:1.55;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}

/* stack up */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.ov{display:flex;flex-direction:column;gap:14px}
.ov-row{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--card2)}
.ov-band{min-width:128px;text-align:center;padding:12px 10px;border-radius:12px}
.ov-band b{display:block;font:800 18px/1.1 var(--display);letter-spacing:-.01em}
.ov-band small{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.ov-txt b{display:flex;align-items:center;gap:8px;font:700 13px var(--display);margin-bottom:3px}
.ov-txt span{font-size:12px;color:var(--muted)}
canvas{display:block;max-width:100%;height:auto;margin:0 auto}
.cap{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

/* highlights */
.hl{background:var(--card2);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.hl.s::before{background:var(--green)}.hl.g::before{background:var(--yellow)}
.hl .k{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl h3{display:flex;align-items:center;gap:9px;font:800 20px/1.2 var(--display);letter-spacing:-.015em;margin:8px 0 4px}
.hl h3 .ic{font-size:20px;color:var(--muted)}
.hl .v{font:600 13px var(--body);margin-bottom:10px}
.hl p{font-size:13px;line-height:1.65;color:var(--muted)}

/* progress table */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td{font-variant-numeric:tabular-nums}
td:first-child{display:flex;align-items:center;gap:8px}
td:first-child .ic{color:var(--muted)}
tr:last-child td{border-bottom:0}

/* force-velocity */
.fvread{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.fvread div{background:var(--card2);border-radius:14px;padding:14px 16px;font-size:12px;line-height:1.55;color:var(--muted)}
.fvread b{display:flex;align-items:center;gap:8px;color:var(--text);font:700 13px var(--display);margin-bottom:5px}
.fvread b .ic{font-size:22px}
.fvprof{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:center;background:var(--card2);border-radius:16px;padding:20px 22px;margin-top:18px}
.fvbal-top{display:flex;justify-content:space-between;font:700 12px var(--display);margin-bottom:10px}
.fvbal-top span{display:inline-flex;align-items:center;gap:7px}
.fvbal-top .ic{font-size:20px}
.fvtrack{position:relative;height:6px;border-radius:999px;background:var(--line2)}
.fvtrack i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.fvtrack .bm{width:3px;height:16px;background:var(--muted);border-radius:2px}
.fvtrack .me{width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid var(--card2);box-shadow:0 0 0 1.5px var(--green)}
.fvbal-cap{font-size:11px;color:var(--muted);margin-top:10px}
.fvtxt p{font-size:13px;line-height:1.6;color:var(--muted)}.fvtxt p+p{margin-top:8px}.fvtxt b{color:var(--text);font-family:var(--display)}
.fvstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.fvstats div{background:var(--card2);border-radius:14px;padding:14px 16px}
.fvstats b{display:block;font:800 24px/1 var(--display);letter-spacing:-.02em;margin-bottom:6px}
.fvstats span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.fine{font-size:11px;color:var(--faint);margin-top:14px}

/* summary + glossary */
.summary .lead{font:700 22px/1.35 var(--display);letter-spacing:-.015em;margin-bottom:22px;max-width:30ch}
.sum-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.sum-cols h3{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.sum-cols h3 i{width:8px;height:8px;border-radius:50%}
.sum-cols p{font-size:14px;line-height:1.75}
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.gloss div{font-size:12.5px;line-height:1.6;color:var(--muted)}
.gloss b{display:flex;align-items:center;gap:8px;color:var(--text);font:700 13px var(--display);margin-bottom:2px}
.gloss b .ic{color:var(--muted)}
footer{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;text-align:center}
footer .logo{font-size:16px}
footer p{font-size:10.5px;line-height:1.7;color:var(--faint);max-width:720px}

/* growth & maturity */
.mat{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:center}
.mat-pill{display:inline-block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.mat h3{font:800 20px/1.2 var(--display);letter-spacing:-.015em;margin:10px 0 6px}
.mat p{font-size:13px;line-height:1.65;color:var(--muted)}
.mat-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mat-stats div{background:var(--card2);border-radius:14px;padding:14px 16px}
.mat-stats b{display:block;font:800 26px/1 var(--display);letter-spacing:-.02em;margin-bottom:6px}
.mat-stats span{font-size:11px;color:var(--muted)}
.mat-line{position:relative;height:10px;border-radius:999px;background:var(--card2)}
.mat-win{position:absolute;top:0;bottom:0;border-radius:999px;background:rgba(97,197,153,.28)}
.mat-line i{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.mat-phv{width:12px;height:12px;background:var(--green)}
.mat-now{width:20px;height:20px;background:var(--text);border:4px solid var(--card)}
.mat-ticks{position:relative;height:18px;margin-top:10px}
.mat-ticks span{position:absolute;transform:translateX(-50%);font:500 10px var(--mono);color:var(--faint)}
.mat-k{display:inline-block;width:10px;height:10px;border-radius:50%}
.mat-k.now{background:var(--text)}.mat-k.phv{background:var(--green)}.mat-k.win{width:16px;border-radius:999px;background:rgba(97,197,153,.35)}
@media screen and (max-width:820px){.mat{grid-template-columns:1fr}}
/* cover page: print only */
.cover{display:none}

/* story card (always dark, 1080 x 1920) */
.story{position:absolute;left:-20000px;top:0;width:1080px;height:1920px;overflow:hidden;background:#141618;color:#F5F7FA;font-family:var(--body);display:flex;flex-direction:column;padding:110px 96px 96px}
.story::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 45% at 85% 8%,rgba(97,197,153,.28),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(74,98,184,.22),transparent 70%)}
.story>*{position:relative}
.st-top{display:flex;justify-content:space-between;align-items:flex-start}
.st-top .logo{font-size:44px}.st-top .logo span{font-size:20px;color:#8B97AB}
.st-top .pby{font-size:18px;color:#5E6878;margin-top:10px}.st-top .pby b{color:#8B97AB}
.st-date{font:500 20px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8B97AB;text-align:right;line-height:1.6}
.st-who{display:flex;align-items:center;gap:32px;margin-top:120px}
.st-who .avatar{width:150px;height:150px;font-size:52px;box-shadow:0 0 0 6px #141618,0 0 0 8px rgba(255,255,255,.18)}
.st-who h1{font:900 92px/0.98 var(--display);letter-spacing:-.04em}
.st-who p{font-size:26px;color:#8B97AB;margin-top:12px}
.st-ring{position:relative;width:560px;height:560px;margin:90px auto 0}
.st-ring svg{width:100%;height:100%}
.st-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.st-ring .k{font:500 24px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#8B97AB}
.st-ring b{font:900 210px/1 var(--display);letter-spacing:-.05em;margin:10px 0}

const R = REPORT, S = R.sessions, G = R.groups, DESC = [...new Set(["rfd","sway","pwr"].concat((R.options && R.options.descriptive) || []))], SOFT = !R.options || R.options.softLowBands !== false;
let cur = S.length - 1;
// F-V estimate when not supplied: F0 = 0.85 x IMTP (N/kg), V0 = 2 x take-off velocity from CMJ height (same basis as the norm benchmarks)
S.forEach(s=>{ if(!s.fv && s.imtp && s.cmj) s.fv = { f0: +(0.85*s.imtp*9.81).toFixed(1), v0: +(2*Math.sqrt(2*9.81*s.cmj/100)).toFixed(2) }; });

const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();
const tint = (c,p) => c + Math.round(p*2.55).toString(16).padStart(2,"0");
const gm = gi => `<i class="gm g${gi}"></i>`;
const gline = gi => gi===0 ? {col:tint(css("--text"),75),dash:[6,4],w:1.6} : {col:css("--muted"),dash:[2,4],w:2};
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
function pct(m,val,gi){const n=NORMS.norms[G[gi].key]; if(!n||!n[m.norm]||val==null) return null; let z=(val-n[m.norm].mean)/n[m.norm].sd; if(m.lower) z=-z; return Math.min(99,Math.max(1,50*(1+erf(z/Math.SQRT2))));}
function band(p){

const colOf = c => c==="g"?css("--green"):c==="r"?css("--red"):css("--yellow");
const fmt = (v,dp) => v==null?"–":Number(v).toLocaleString("en-GB",{minimumFractionDigits:dp,maximumFractionDigits:dp});

const initials = n => n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const avatar = () => `<div class="avatar">${R.athlete.photo?`<img src="${R.athlete.photo}" alt="">`:initials(R.athlete.name)}</div>`;
const stamp = `<div class="stamp"><b>GYMGEEK</b> Analyse · Powered by <b>ATHLEEK</b> · gymgeekonline.co.uk · athleek.co.uk</div>`;

// Smallest worthwhile change: differences inside these limits are within normal test-to-test variation
const SWC={cmj:{abs:2.0},rsi:{abs:0.03},pwr:{abs:1.5},imtp:{abs:0.15},rfd:{rel:0.15},asym:{abs:3.0},sway:{rel:0.15},score:{abs:3}};
const swcOf=(k,base)=>{const t=SWC[k]; if(!t) return 0; return t.abs!=null?t.abs:Math.abs(base||0)*t.rel;};
function deltaChip(df,lower,dp,suffix=" vs last",key,base){
  if(df==null) return "";

  if(Math.abs(df)<thr||Math.abs(df)<1e-9){const c=css("--muted"); return `<span class="delta" title="Within normal test-to-test variation" style="color:${c};background:${tint(c,14)}">≈ ${sign}${fmt(df,dp)} · no real change</span>`;}

}

// Athleticism Score: 0-100, weighted percentiles vs Group 1 (same reference for every session so scores are comparable)
const SCORE_W={cmj:45,imtp:30,rsi:15,asym:10};
function athScore(s){let t=0,w=0;for(const k in SCORE_W){const p=pct(mk(k),s[k],0);if(p!=null){t+=p*SCORE_W[k];w+=SCORE_W[k];}}return w?Math.round(t/w):null;}
const scoreLvl = sc => sc>=90?["Exceptional","g"]:sc>=67?["Strong","g"]:sc>=34?["Solid","a"]:["Building","a"];
// Maturity offset (Moore et al. 2015). Boys: age x sitting height. Girls: age x standing height. Accurate to roughly +/- 1 year.
function maturity(){
  const A=R.athlete, age=A.ageDecimal||A.age; if(!age||age>=18||!A.sex) return null;
  const male=/^m/i.test(A.sex);
  if(male&&!A.sittingHeight) return null; if(!male&&!A.height) return null;
  const mo = male ? -8.128741 + 0.0070346*(age*A.sittingHeight) : -7.709133 + 0.0042232*(age*A.height);
  const status = mo < -1 ? ["Pre-PHV","Before your main growth spurt","Your biggest growth spurt is still ahead. Strength and power typically rise sharply through and after it, so today's numbers are an early marker, not a ceiling."]
    : mo <= 1 ? ["Circa-PHV","Around your fastest growth","You are around your fastest period of growth. It is normal for coordination, jump scores and symmetry to wobble for a while as your limbs grow faster than your strength catches up."]

  return {mo, aphv: age-mo, age, status};
}
function maturityCard(){

      <div class="legend" style="margin-top:22px"><span><i class="mat-k now"></i>You now</span><span><i class="mat-k phv"></i>Estimated peak growth</span><span><i class="mat-k win"></i>Fastest growth window</span></div></div></div>
    <p class="fine">Estimated from age, ${/^m/i.test(R.athlete.sex)?"sitting height":"height"} and sex (Moore et al. 2015). Accurate to roughly ± 1 year, so treat it as a guide. Comparison groups are by age, not maturity.</p>${stamp}</section>`;
}
function overall(gi,s){const ps=M.filter(m=>!isDesc(m)).map(m=>pct(m,s[m.k],gi)).filter(p=>p!=null); return ps.length?ps.reduce((a,b)=>a+b)/ps.length:null;}

function autoNote(m){

}

function spark(m){

function stripHTML(p,gi){

function tile(m){

  ${progress}
  ${fv?`<section class="card" data-pdf data-sec="fv">${sh("Force-Velocity Profile",chartLegend(cur>0&&S[cur-1].fv))}
    <div class="fvread"><div><b>${icon("tractor")}Force end</b>Where the line meets the left axis: your strength, like a tractor pulling a heavy load.</div><div><b>${icon("car")}Speed end</b>Where the line meets the bottom axis: how fast you can move with no load, like an F1 car.</div><div><b>${icon("trend")}Is my line good?</b>Further out from the corner is better. A line above the dashed averages means more total power.</div></div>
    <canvas id="fv" data-h="300"></canvas>
    ${fvProfile(fv,fvB(0))}
    <div class="fvstats"><div><b class="num" style="color:${css("--green")}">${fmt(fv.f0,1)}</b><span>${icon("tractor")}Max force · N/kg</span></div><div><b class="num" style="color:${css("--green")}">${fmt(fv.v0,2)}</b><span>${icon("car")}Max speed · m/s</span></div><div><b class="num">${fmt(fv.f0*fv.v0/4,1)}</b><span>${icon("bolt")}Peak power · W/kg</span></div><div><b class="num">${fmt(-fv.f0/fv.v0,2)}</b><span>Slope</span></div></div>
    <p class="fine">Estimated from your pull and jump: a directional guide, not a precision measurement.</p>${stamp}</section>`:""}
  <section class="card summary" data-pdf data-sec="summary">${sh("Your Summary")}<p class="lead">${A.first}, here's how you got on.</p><div class="sum-cols"><div><h3><i style="background:${css("--green")}"></i>What went well</h3><p>${R.summary.strengths}</p></div><div><h3><i style="background:${css("--yellow")}"></i>What is developing</h3><p>${R.summary.developing}</p></div></div><p class="fine">Retest recommended in 3–6 months.</p>${stamp}</section>
  <section class="card" data-pdf>${sh("What We Measured","",false)}<div class="gloss">${M.map(m=>`<div><b>${icon(m.ic)}${m.name}</b>${m.desc}</div>`).join("")}<div><b>${icon("target")}Athleticism Score</b>One 0–100 number combining jump height (45%), maximum force (30%), reactive strength (15%) and leg symmetry (10%), each scored against your first comparison group. 50 is the group average.</div><div><b>${icon("trend")}Real change</b>Differences smaller than normal test-to-test variation are shown in grey as "no real change": about 2 cm for jump height, 0.03 RSI, 0.15 × BW for maximum force, 3 points for the Athleticism Score.</div><div><b>Bands</b>Top 10%, Upper Third, Average, Building. Banded rather than exact percentiles because norm data varies between equipment and protocols.</div></div></section>
  <footer><div class="logo">GYMGEEK<span>ANALYSE</span></div><div class="pby">Powered by <b>ATHLEEK</b> · gymgeekonline.co.uk · athleek.co.uk</div><div class="pby">${REPORT_VERSION}</div><p>Beta software. For performance monitoring only, not medical advice. Bands are calibrated against published normative data and are not precise percentile ranks. RFD, explosive power and postural sway are descriptive only. F-V values are modelled estimates. © ${new Date().getFullYear()} GymGeek Dorset.</p></footer>`;
  document.title=fstem();
  document.querySelectorAll(".sec-n").forEach((e,i)=>e.textContent=String(i+1).padStart(2,"0"));
  drawRadar(); drawFV();
}

function hiDPI(c,w,h){const k=document.body.classList.contains("print")?3:(window.devicePixelRatio||1); c.width=Math.round(w*k); c.height=Math.round(h*k); c.style.width=w+"px"; const x=c.getContext("2d"); x.setTransform(k,0,0,k,0,0); return x;}
const FONT = w => `${w||500} 11px Open Sans, system-ui, sans-serif`;
function canvasIcon(x,name,cx,cy,size,col){x.save();x.translate(cx-size/2,cy-size/2);x.scale(size/24,size/24);x.strokeStyle=col;x.lineWidth=1.8;x.lineCap="round";x.lineJoin="round";x.stroke(new Path2D(IC[name]));x.restore();}

function drawRadar(){
  const c=document.getElementById("radar"); if(!c) return;
  const W=Math.min(+c.dataset.w, c.parentElement.clientWidth||380), H=+c.dataset.h, x=hiDPI(c,W,H);
  const cx=W/2, cy=H/2+2, r=Math.min(W,H)/2-48, N=M.length, ang=i=>Math.PI*2*i/N-Math.PI/2, pt=(i,rr)=>[cx+rr*Math.cos(ang(i)),cy+rr*Math.sin(ang(i))];
  const lab=["Jump","Reactive","Power","Max Force","RFD","Symmetry","Stability"];
  x.strokeStyle=css("--line"); x.lineWidth=1;
  [.25,.5,.75,1].forEach(f=>{x.beginPath();for(let i=0;i<=N;i++){const p=pt(i%N,r*f);i?x.lineTo(...p):x.moveTo(...p);}x.stroke();});
  for(let i=0;i<N;i++){x.beginPath();x.moveTo(cx,cy);x.lineTo(...pt(i,r));x.stroke();}
  const poly=(vals,st,fill)=>{x.beginPath();x.setLineDash(st.dash||[]);vals.forEach((v,i)=>{const p=pt(i,r*v/100);i?x.lineTo(...p):x.moveTo(...p);});x.closePath();if(fill){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,tint(st.col,6));g.addColorStop(1,tint(st.col,33));x.fillStyle=g;x.fill();}x.strokeStyle=st.col;x.lineWidth=st.w;x.lineJoin="round";x.stroke();x.setLineDash([]);};
  G.forEach((g,gi)=>{const n=NORMS.norms[g.key]; poly(M.map(m=>gi===0?50:(n&&n[m.norm]?pct(m,n[m.norm].mean,0):50)),gline(gi),false);});
  if(cur>0) poly(M.map(m=>pct(m,S[cur-1][m.k],0)||0),{col:tint(css("--green"),55),dash:[6,4],w:1.6},false);
  const me=M.map(m=>pct(m,S[cur][m.k],0)||0); poly(me,{col:css("--green"),w:2.5},true);
  me.forEach((v,i)=>{const p=pt(i,r*v/100);x.beginPath();x.arc(...p,4,0,Math.PI*2);x.fillStyle=css("--card");x.fill();x.lineWidth=2.5;x.strokeStyle=css("--green");x.stroke();});
  x.fillStyle=css("--muted"); x.font=FONT(600); x.textBaseline="middle";
  lab.forEach((l,i)=>{const [px,py]=pt(i,r+20); x.textAlign=px<cx-5?"right":px>cx+5?"left":"center"; x.fillText(l,px,py);});
}

function drawFV(){
  const c=document.getElementById("fv"); if(!c) return;
  const W=document.body.classList.contains("print")?660:Math.max(300,c.parentElement.clientWidth-56), H=+c.dataset.h, x=hiDPI(c,W,H);
  const lines=[]; G.forEach((g,gi)=>{const b=NORMS.fv[g.key]||NORMS.fv[FV_ALIAS[g.key]]; if(b) lines.push({f0:b.f0,v0:b.v0,...gline(gi)});});
  if(cur>0&&S[cur-1].fv) lines.push({f0:S[cur-1].fv.f0,v0:S[cur-1].fv.v0,col:tint(css("--green"),55),dash:[6,4],w:1.6});
  const me=S[cur].fv; lines.push({f0:me.f0,v0:me.v0,col:css("--green"),w:3});
  const pad={l:48,r:20,t:18,b:40}, pw=W-pad.l-pad.r, ph=H-pad.t-pad.b, mV=Math.ceil(Math.max(...lines.map(l=>l.v0))*1.15), mF=Math.ceil(Math.max(...lines.map(l=>l.f0))*1.15/5)*5;
  const fx=v=>pad.l+v/mV*pw, fy=f=>pad.t+ph-f/mF*ph;
  x.font=FONT(); x.fillStyle=css("--muted"); x.strokeStyle=css("--line"); x.lineWidth=1;
  for(let i=0;i<=5;i++){const f=i*mF/5; x.beginPath();x.moveTo(pad.l,fy(f));x.lineTo(pad.l+pw,fy(f));x.stroke(); x.textAlign="right";x.fillText(f.toFixed(0),pad.l-10,fy(f)+4);}
  for(let v=0;v<=mV;v++){x.textAlign="center";x.fillText(v,fx(v),pad.t+ph+18);}
  x.font=FONT(600); x.textAlign="center"; x.fillText("Speed (m/s)",pad.l+pw/2,H-4);
  x.save();x.translate(12,pad.t+ph/2);x.rotate(-Math.PI/2);x.fillText("Force (N/kg)",0,0);x.restore();
  x.beginPath();x.moveTo(fx(0),fy(0));x.lineTo(fx(0),fy(me.f0));x.lineTo(fx(me.v0),fy(0));x.closePath();
  const gr=x.createLinearGradient(0,fy(me.f0),0,fy(0)); gr.addColorStop(0,tint(css("--green"),19)); gr.addColorStop(1,tint(css("--green"),2)); x.fillStyle=gr; x.fill();
  lines.forEach(l=>{x.beginPath();x.setLineDash(l.dash||[]);x.strokeStyle=l.col;x.lineWidth=l.w;x.lineCap="round";x.moveTo(fx(0),fy(l.f0));x.lineTo(fx(l.v0),fy(0));x.stroke();x.setLineDash([]);});
  canvasIcon(x,"tractor",pad.l+20,pad.t+12,24,css("--muted")); canvasIcon(x,"car",pad.l+pw-16,pad.t+ph-16,26,css("--muted"));
  const px=fx(me.v0/2), py=fy(me.f0/2);
  x.beginPath();x.arc(px,py,10,0,Math.PI*2);x.fillStyle=tint(css("--green"),20);x.fill();
  x.beginPath();x.arc(px,py,5.5,0,Math.PI*2);x.fillStyle=css("--green");x.fill();
  x.font=FONT(700); x.textAlign="left"; x.fillStyle=css("--text"); x.fillText("Your peak power point",px+16,py+4);
}

function toggleLight(){document.body.classList.toggle("light");render();}
function isoDate(d){const t=new Date(d); return isNaN(t)?String(d).replace(/\s+/g,"-"):t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function fstem(){return "GymGeek_Analyse_"+R.athlete.name.trim().replace(/\s+/g,"_").replace(/[^\w]/g,"")+"_"+isoDate(S[cur].date);}
function fname(ext,suffix=""){return fstem()+suffix+"."+ext;}
function deliver(canvas,name){
  canvas.toBlob(b=>{const f=new File([b],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:"My GymGeek results",text:"Just got my force plate results at GymGeek Dorset! #GymGeekDorset"}).catch(()=>{});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}},"image/png");
}
async function shareBlock(btn){
  const el=btn.closest("[data-pdf]"); document.body.classList.add("capturing","static");
  try{ deliver(await html2canvas(el,{scale:2,useCORS:true,backgroundColor:css("--bg"),logging:false}),fname("png","_"+(el.querySelector("h2")?el.querySelector("h2").textContent.replace(/[^A-Za-z]+/g,"_").replace(/_+$/,""):"Card"))); }
  finally{ document.body.classList.remove("capturing","static"); }
}

// Instagram story card, 1080 x 1920, always dark
function storyHTML(){
  const A=R.athlete, s=S[cur], sc=athScore(s), lv=scoreLvl(sc||0), prev=cur>0?athScore(S[cur-1]):null;
  const best=pick().strong, lvCol=lv[1]==="g"?"#61C599":"#FFC11E", r=262, C=2*Math.PI*r, arc=C*(sc||0)/100;
  const stat=(k)=>{const m=mk(k); return s[k]==null?"":`<div>${icon(m.ic)}<b>${fmt(s[k],m.dp)}<small>${m.unit}</small></b><span>${m.name}</span></div>`;};
  const d=prev!=null?sc-prev:null, dTxt=d==null?"":Math.abs(d)<SWC.score.abs?`<span style="color:#8B97AB">Holding steady since last test</span>`:d>0?`<span style="color:#61C599">▲ +${d} since last test</span>`:`<span style="color:#FFC11E">▼ ${d} since last test</span>`;
  return `<div class="story" id="story">
    <div class="st-top"><div><div class="logo">GYMGEEK<span>ANALYSE</span></div><div class="pby">Powered by <b>ATHLEEK</b></div></div><div class="st-date">${S.length===1?"Baseline":"Session "+(cur+1)}<br>${s.date}</div></div>
    <div class="st-who">${avatar()}<div><h1>${A.name}</h1><p>${[A.position,A.sport].filter(Boolean).join(" · ")}</p></div></div>
    ${sc!=null?`<div class="st-ring"><svg viewBox="0 0 560 560"><circle cx="280" cy="280" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="28"/><circle transform="rotate(-90 280 280)" cx="280" cy="280" r="${r}" fill="none" stroke="${lvCol}" stroke-width="28" stroke-linecap="round" stroke-dasharray="${arc} ${C}"/></svg><div class="c"><span class="k">Athleticism Score</span><b>${sc}</b><span class="lvl" style="color:${lvCol}">${lv[0]}</span></div></div><div class="st-delta">${dTxt}</div>`:""}
    ${best?`<div class="st-best">${icon(best.ic)}<span>Standout: <b>${best.name}</b> · ${band(pct(best,s[best.k],0)).label}</span></div>`:""}
    <div class="st-stats">${stat("cmj")}${stat("imtp")}${stat("asym")}</div>
    <div class="st-foot"><span>Tested at <b>GymGeek Dorset</b></span><span>gymgeekonline.co.uk</span></div>
  </div>`;
}
async function shareStory(){
  const l=document.getElementById("story-l"); l.textContent="Creating…";
  document.body.insertAdjacentHTML("beforeend",storyHTML()); const el=document.getElementById("story");
  try{ await document.fonts.ready; deliver(await html2canvas(el,{scale:1,width:1080,height:1920,backgroundColor:"#141618",useCORS:true,logging:false}),fname("png","_Story")); }
  finally{ el.remove(); l.textContent="Story card"; }
}

window.addEventListener("beforeprint",()=>{wasLight=document.body.classList.contains("light");document.body.classList.add("print","static");render();});
window.addEventListener("afterprint",()=>{document.body.classList.remove("print","static");if(wasLight)document.body.classList.add("light");render();});

window.addEventListener("load",render);

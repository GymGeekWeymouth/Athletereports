<style>
:root{--bg:#2A2D30;--card:#27292B;--card2:#2f3235;--line:#3a3d40;--soft:rgba(255,255,255,.06);--text:#f0f4ff;--muted:#7a8ba8;--green:#61C599;--yellow:#FFC11E;--blue:#778FDD;--red:#ff6363;--strip:rgba(255,255,255,.05)}
body.light,body.pdf-export{--bg:#f0f2f4;--card:#fff;--card2:#f5f7f9;--line:#d8dde3;--soft:rgba(0,0,0,.07);--text:#1a1c1e;--muted:#5a6a7a;--green:#1a9e6a;--yellow:#c8900a;--blue:#4a62b8;--red:#d94040;--strip:rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;padding:24px 16px 48px;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
body.pdf-export .wrap{width:900px;max-width:900px}
.brand{font-family:'Raleway',sans-serif;font-style:italic;font-weight:900;color:var(--text)}
.brand span{font-family:'Jost',sans-serif;font-style:normal;font-weight:200;letter-spacing:.4em;opacity:.55;margin-left:6px;font-size:.6em}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top>div>.brand{font-size:24px}
.pby{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em}.pby .brand{font-size:11px}
.btns{display:flex;gap:8px}
.btn{font:500 12px 'DM Sans',sans-serif;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero h1{font:400 44px/1 'Bebas Neue',sans-serif;letter-spacing:.03em}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 11px 'DM Sans',sans-serif;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#1a1c1e}
.banner{font-size:12px;line-height:1.6;color:var(--muted);border-left:3px solid var(--green);padding:10px 14px;background:var(--card);border-radius:0 10px 10px 0}
.banner b{color:var(--text)}
.h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.h2 h2{font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:.04em}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
body.pdf-export .tiles{grid-template-columns:1fr 1fr}
.tile{background:var(--card2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-name{font-size:13px;font-weight:600}
.badge{font-size:9px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:4px;white-space:nowrap}
.t-val{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.num{font:400 42px/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.unit{font-size:12px;color:var(--muted)}
.delta{font-size:11px;font-weight:700;margin-left:auto;padding:2px 7px;border-radius:10px}
.spark{display:block;width:100%;height:26px}
.srow{font-size:11px}
.srow+.srow{margin-top:10px}
.slab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.slab span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.sg{width:9px;height:9px;border-radius:50%;flex:none}
.davg{font-size:10px}
.sx{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);opacity:.7;margin-top:3px}
.strip{position:relative;height:8px;display:flex;gap:2px}
.strip s{display:block;flex:none;height:100%;border-radius:2px;opacity:.28}
.strip i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--text)}
.sband{text-align:right;font-weight:600;white-space:nowrap}
.davg{color:var(--muted)}
.t-note{font-size:11px;line-height:1.5;color:var(--muted);border-top:1px solid var(--soft);padding-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.two{grid-template-columns:1fr}.hero h1{font-size:36px}}
.overall{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.pill{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.04em;padding:8px 12px;border-radius:10px;border:2px solid;text-align:center;min-width:120px}
.pill small{display:block;font:600 9px 'DM Sans',sans-serif;letter-spacing:.06em;margin-top:3px;opacity:.75}
.ov-txt{font-size:12px;color:var(--muted);line-height:1.5}
.ov-txt b{color:var(--text);display:block;font-size:13px;margin-bottom:2px}
canvas{display:block;max-width:100%;margin:0 auto}
.hl{display:flex;gap:14px;align-items:flex-start}
.hl .pill{min-width:104px;font-size:18px}
.hl p{font-size:12px;line-height:1.6;color:var(--muted)}
.hl p b{color:var(--text);display:block;font-size:13px;margin-bottom:3px}
.fvstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center}
.fvstats div b{display:block;font:400 24px/1 'Bebas Neue',sans-serif}
.fvstats div span{font-size:10px;color:var(--muted)}
.fvread{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.fvread div{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.5;color:var(--muted)}
.fvread b{display:block;color:var(--text);font-size:12px;margin-bottom:2px}
.fvprof{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:center;background:var(--card2);border-radius:10px;padding:14px 16px;margin-top:12px}
.fvbal-top{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:8px}
.fvtrack{position:relative;height:8px;border-radius:4px;background:var(--line)}
.fvtrack i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.fvtrack .bm{width:3px;height:16px;background:var(--muted);border-radius:2px}
.fvtrack .me{width:16px;height:16px;border-radius:50%;background:var(--green);border:2px solid var(--text)}
.fvbal-cap{font-size:10px;color:var(--muted);margin-top:8px}
.fvtxt p{font-size:12px;line-height:1.55;color:var(--muted)}.fvtxt p+p{margin-top:6px}.fvtxt b{color:var(--text)}
@media(max-width:720px){.fvread,.fvprof{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
.summary p{font-size:13px;line-height:1.7;margin-bottom:10px;max-width:75ch}
.summary h3{font-size:13px;margin-bottom:4px}
.gloss{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:11px;line-height:1.5;color:var(--muted)}
.gloss b{color:var(--text)}
@media(max-width:720px){.gloss{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--soft);font-size:9px;color:var(--muted)}
.share{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;font:500 10px 'DM Sans',sans-serif;cursor:pointer}
body.pdf-export .share,body.pdf-export .btns,body.pdf-export .chips{display:none}
footer{font-size:9px;line-height:1.6;color:var(--muted);text-align:center;opacity:.7;max-width:760px;margin:8px auto 0}
</style>

function pick(){

  ${progress}
  ${fv?`<section class="card" data-pdf><div class="h2"><h2>Force-Velocity Profile</h2><div class="legend"><span><i style="background:${css("--green")}"></i>You</span>${G.map((g,gi)=>fvB(gi)?`<span><i style="background:${gcol(gi)}"></i>${g.short} average</span>`:"").join("")}${cur>0&&S[cur-1].fv?`<span><i style="background:${css("--muted")}"></i>Last session</span>`:""}</div></div>
  <div class="fvread"><div><b>🚜 Force end</b>Where the line meets the left axis: your strength, like a tractor pulling a heavy load.</div><div><b>🏎️ Speed end</b>Where the line meets the bottom axis: how fast you can move with no load, like an F1 car.</div><div><b>📈 Is my line good?</b>Further out from the corner is better. A line above the dashed averages means more total power.</div></div>
  <canvas id="fv" width="860" height="280"></canvas>
  ${fvProfile(fv,fvB(0))}
  <div class="fvstats"><div><b style="color:${css("--green")}">${fmt(fv.f0,1)}</b><span>🚜 Max force (N/kg)</span></div><div><b style="color:${css("--green")}">${fmt(fv.v0,2)}</b><span>🏎️ Max speed (m/s)</span></div><div><b>${fmt(fv.f0*fv.v0/4,1)}</b><span>Peak power (W/kg)</span></div><div><b>${fmt(-fv.f0/fv.v0,2)}</b><span>Slope</span></div></div><p style="font-size:11px;color:${css("--muted")};margin-top:10px">Estimated from your pull and jump: a directional guide, not a precision measurement.</p>${foot(true)}</section>`:""}
  <section class="card summary" data-pdf><div class="h2"><h2>${A.first}, here's how you got on</h2></div><h3 style="color:${css("--green")}">What went well</h3><p>${R.summary.strengths}</p><h3 style="color:${css("--yellow")}">What is developing</h3><p>${R.summary.developing}</p><p style="font-size:11px;color:${css("--muted")}">Retest recommended in 3–6 months.</p>${foot(true)}</section>
  <section class="card" data-pdf><div class="h2"><h2>What We Measured</h2></div><div class="gloss">${M.map(m=>`<div><b>${m.name}.</b> ${m.desc}</div>`).join("")}<div><b>Bands.</b> Top 10%, Upper Third, Average, Building. Banded rather than exact percentiles because norm data varies between equipment and protocols.</div></div>${foot(false)}</section>
  <footer>Beta software. For performance monitoring only, not medical advice. Bands are calibrated against published normative data and are not precise percentile ranks. RFD, explosive power and postural sway are descriptive only. F-V values are modelled estimates. © ${new Date().getFullYear()} GymGeek Dorset.</footer>`;
  drawRadar(); drawFV();
}

function drawRadar(){
  const c=document.getElementById("radar"); if(!c) return; const x=c.getContext("2d"), W=c.width, H=c.height, cx=W/2, cy=H/2+4, r=Math.min(W,H)/2-44, N=M.length;
  const lab=["Jump","Reactive","Power","Max Force","RFD","Symmetry","Stability"], ang=i=>Math.PI*2*i/N-Math.PI/2, pt=(i,rr)=>[cx+rr*Math.cos(ang(i)),cy+rr*Math.sin(ang(i))];
  x.clearRect(0,0,W,H); x.strokeStyle=css("--line"); x.lineWidth=1;
  [.25,.5,.75,1].forEach(f=>{x.beginPath();for(let i=0;i<=N;i++){const p=pt(i%N,r*f);i?x.lineTo(...p):x.moveTo(...p);}x.stroke();});
  for(let i=0;i<N;i++){x.beginPath();x.moveTo(cx,cy);x.lineTo(...pt(i,r));x.stroke();}
  // every axis is scaled against group 1: centre = low, edge = high, middle ring = group 1 average
  const poly=(vals,col,dash,fill)=>{x.beginPath();x.setLineDash(dash?[5,4]:[]);vals.forEach((v,i)=>{const p=pt(i,r*v/100);i?x.lineTo(...p):x.moveTo(...p);});x.closePath();if(fill){x.fillStyle=col+"30";x.fill();}x.strokeStyle=col;x.lineWidth=dash?1.8:2.5;x.stroke();x.setLineDash([]);};
  G.forEach((g,gi)=>{const n=NORMS.norms[g.key]; poly(M.map(m=>gi===0?50:(n&&n[m.norm]?pct(m,n[m.norm].mean,0):50)),gcol(gi),true,false);});
  if(cur>0) poly(M.map(m=>pct(m,S[cur-1][m.k],0)||0),css("--muted"),true,false);
  const me=M.map(m=>pct(m,S[cur][m.k],0)||0); poly(me,css("--green"),false,true);
  me.forEach((v,i)=>{const p=pt(i,r*v/100);x.beginPath();x.arc(...p,3.5,0,Math.PI*2);x.fillStyle=css("--green");x.fill();});
  x.fillStyle=css("--muted"); x.font="10px DM Sans, sans-serif"; x.textBaseline="middle";
  lab.forEach((l,i)=>{const [px,py]=pt(i,r+18); x.textAlign=px<cx-5?"right":px>cx+5?"left":"center"; x.fillText(l,px,py);});
}

function drawFV(){
  const c=document.getElementById("fv"); if(!c) return; const W=Math.max(320,c.parentElement.clientWidth-40||860); c.width=W; const H=c.height, x=c.getContext("2d");
  const lines=[]; G.forEach((g,gi)=>{const b=NORMS.fv[g.key]||NORMS.fv[FV_ALIAS[g.key]]; if(b) lines.push({f0:b.f0,v0:b.v0,col:gcol(gi),dash:true});});
  if(cur>0&&S[cur-1].fv) lines.push({f0:S[cur-1].fv.f0,v0:S[cur-1].fv.v0,col:css("--muted"),dash:true,lbl:"Last"});
  const me=S[cur].fv; lines.push({f0:me.f0,v0:me.v0,col:css("--green"),me:true});
  const pad={l:44,r:16,t:12,b:34}, pw=W-pad.l-pad.r, ph=H-pad.t-pad.b, mV=Math.max(...lines.map(l=>l.v0))*1.15, mF=Math.max(...lines.map(l=>l.f0))*1.15;
  const fx=v=>pad.l+v/mV*pw, fy=f=>pad.t+ph-f/mF*ph;
  x.clearRect(0,0,W,H); x.strokeStyle=css("--line"); x.lineWidth=1; x.fillStyle=css("--muted"); x.font="10px DM Sans, sans-serif";
  for(let i=0;i<=5;i++){const v=i*mV/5,f=i*mF/5; x.beginPath();x.moveTo(fx(v),pad.t);x.lineTo(fx(v),pad.t+ph);x.stroke(); x.beginPath();x.moveTo(pad.l,fy(f));x.lineTo(pad.l+pw,fy(f));x.stroke(); x.textAlign="center";x.fillText(v.toFixed(1),fx(v),pad.t+ph+13); x.textAlign="right";x.fillText(f.toFixed(0),pad.l-6,fy(f)+3);}
  x.textAlign="center"; x.fillText("Speed (m/s)",pad.l+pw/2,H-4); x.font="18px sans-serif"; x.textAlign="right"; x.fillText("🏎️",pad.l+pw,pad.t+ph-8); x.textAlign="left"; x.fillText("🚜",pad.l+6,pad.t+14); x.font="10px DM Sans, sans-serif"; x.textAlign="center"; x.save();x.translate(11,pad.t+ph/2);x.rotate(-Math.PI/2);x.fillText("Force (N/kg)",0,0);x.restore();
  lines.forEach(l=>{x.beginPath();x.setLineDash(l.dash?[6,4]:[]);x.strokeStyle=l.col;x.lineWidth=l.me?3:2;x.moveTo(fx(0),fy(l.f0));x.lineTo(fx(l.v0),fy(0));x.stroke();x.setLineDash([]);});
  x.beginPath();x.arc(fx(me.v0/2),fy(me.f0/2),6,0,Math.PI*2);x.fillStyle=css("--green");x.fill(); x.textAlign="left";x.fillStyle=css("--text");x.fillText("Your peak power point",fx(me.v0/2)+10,fy(me.f0/2)+3);
}

function toggleLight(){document.body.classList.toggle("light");render();}
function fname(ext){const m=["January","February","March","April","May","June","July","August","September","October","November","December"];return R.athlete.name.replace(/\s+/g,"_").replace(/[^\w]/g,"")+"_"+m[new Date().getMonth()]+"_GYMGEEK."+ext;}
function snap(el){return html2canvas(el,{scale:2,useCORS:true,backgroundColor:css("--bg"),logging:false});}
function shareBlock(btn){const el=btn.closest("[data-pdf]"); btn.style.visibility="hidden";
  snap(el).then(cv=>{btn.style.visibility="";cv.toBlob(b=>{const f=new File([b],fname("png"),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:"My GymGeek results",text:"Just got my force plate results at GymGeek Dorset! #GymGeekDorset"}).catch(()=>{});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname("png");a.click();}});});}
async function exportPDF(){
  const btn=document.getElementById("pdf-btn"); btn.disabled=true; btn.textContent="Generating…";
  const wasLight=document.body.classList.contains("light"); document.body.classList.add("pdf-export"); render();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:"pt",format:"a4"}), PW=595.28, PH=841.89, mg=20, uw=PW-mg*2;
  const bg=()=>{pdf.setFillColor(240,242,244);pdf.rect(0,0,PW,PH,"F");}; bg(); let y=mg;
  for(const el of document.querySelectorAll("[data-pdf]")){
    const cv=await snap(el); let w=uw, h=cv.height/cv.width*uw; if(h>PH-mg*2){h=PH-mg*2;w=cv.width/cv.height*h;}
    if(y+h>PH-mg){pdf.addPage();bg();y=mg;}
    pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",mg+(uw-w)/2,y,w,h); y+=h+10;
  }
  pdf.save(fname("pdf"));
  document.body.classList.remove("pdf-export"); if(wasLight) document.body.classList.add("light"); render();
}
window.addEventListener("load",render);
window.addEventListener("resize",()=>drawFV());
</script>
